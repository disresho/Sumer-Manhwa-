
name: Build Sumer Manhwa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -q Sumer-Manhwa-Android-Stage3.zip -d extracted
          test -f extracted/ROSHAR-Android/settings.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: extracted/ROSHAR-Android
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumer-Manhwa-debug-APK
          path: extracted/ROSHAR-Android/app/build/outputs/apk/debug/app-debug.apk
